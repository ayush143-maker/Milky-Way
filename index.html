<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OpenRouter Tester</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --surface: #1a1a1a;
            --text: #ffffff;
            --subtext: #a0a0a0;
            --accent: #ff2f92; /* Hot Pink */
            --accent-glow: rgba(255, 47, 146, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            background: var(--surface);
            padding: 15px;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        h1 {
            font-size: 1.2rem;
            color: var(--accent);
            letter-spacing: 1px;
        }

        #settings-btn {
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            justify-content: center;
            background: var(--surface);
            padding: 10px 15px;
            border-bottom: 1px solid #333;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid #444;
            color: var(--subtext);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: bold;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* Main Content */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: none;
        }
        .content.active { display: block; }

        /* Models List */
        .model-card {
            background: var(--surface);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .model-card:active {
            transform: scale(0.98);
            border-color: var(--accent);
        }
        .model-id {
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--accent);
            word-break: break-all;
        }
        .model-info {
            font-size: 0.75rem;
            color: var(--subtext);
            margin-top: 5px;
        }

        /* Chat UI */
        #chat-messages {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 80px;
        }
        .msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .msg.user {
            align-self: flex-end;
            background: var(--accent);
            color: #000;
            border-bottom-right-radius: 4px;
            font-weight: 500;
        }
        .msg.ai {
            align-self: flex-start;
            background: var(--surface);
            border: 1px solid #333;
            border-bottom-left-radius: 4px;
        }
        .msg.system {
            align-self: center;
            background: transparent;
            color: var(--subtext);
            font-size: 0.8rem;
            font-style: italic;
            text-align: center;
        }

        /* Input Area */
        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            padding: 10px 15px;
            border-top: 1px solid #333;
            display: none; 
            gap: 10px;
        }
        .input-area.active { display: flex; }

        #user-input {
            flex: 1;
            background: var(--bg);
            border: 1px solid #444;
            color: var(--text);
            padding: 12px;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
        }
        #user-input:focus { border-color: var(--accent); }

        #send-btn {
            background: var(--accent);
            border: none;
            color: #000;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #send-btn:disabled { background: #555; cursor: not-allowed; }

        /* Settings Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }

        .modal-box {
            background: var(--surface);
            border: 1px solid var(--accent);
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .modal-box h2 {
            color: var(--accent);
            margin-bottom: 15px;
            font-size: 1.2rem;
            text-align: center;
        }

        .modal-box p {
            color: var(--subtext);
            font-size: 0.8rem;
            margin-bottom: 15px;
            text-align: center;
        }

        #api-key-input {
            width: 100%;
            background: var(--bg);
            border: 1px solid #444;
            color: var(--text);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: monospace;
            outline: none;
            margin-bottom: 20px;
        }
        #api-key-input:focus { border-color: var(--accent); }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        #save-key-btn {
            background: var(--accent);
            color: #000;
        }

        #cancel-btn {
            background: #333;
            color: var(--text);
        }

        /* Spinner */
        .spinner {
            width: 24px; height: 24px;
            border: 3px solid #444;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <h1>OPENROUTER</h1>
        <button id="settings-btn" onclick="openSettings()">⚙️</button>
    </header>

    <!-- TABS -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('models')">🔍 Models</button>
        <button class="tab-btn" onclick="switchTab('chat')">💬 Chat</button>
    </div>

    <!-- TAB 1: MODELS -->
    <div id="models-tab" class="content active">
        <p style="color: var(--subtext); font-size: 0.8rem; margin-bottom: 15px; text-align: center;">
            Tap any model to select it for chatting.
        </p>
        <div id="models-list">
            <p style="text-align:center; color:var(--subtext);">Click ⚙️ to add your API Key first.</p>
        </div>
    </div>

    <!-- TAB 2: CHAT -->
    <div id="chat-tab" class="content">
        <div id="chat-messages">
            <div class="msg system">Select a model first, then start chatting!</div>
        </div>
    </div>

    <!-- CHAT INPUT -->
    <div id="input-area" class="input-area">
        <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off">
        <button id="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-box">
            <h2>⚙️ API Settings</h2>
            <p>Enter your OpenRouter API Key. It will be saved locally on your phone.</p>
            <input type="text" id="api-key-input" placeholder="sk-or-v1-..." autocomplete="off">
            <div class="modal-buttons">
                <button id="cancel-btn" onclick="closeSettings()">Cancel</button>
                <button id="save-key-btn" onclick="saveKey()">Save Key</button>
            </div>
        </div>
    </div>

    <script>
        let API_KEY = localStorage.getItem('openrouter_key') || '';
        let selectedModel = "meta-llama/llama-3.1-8b-instruct:free"; 
        let chatHistory = [];

        // --- SETTINGS MODAL ---
        function openSettings() {
            document.getElementById('settings-modal').classList.add('active');
            document.getElementById('api-key-input').value = API_KEY;
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.remove('active');
        }

        function saveKey() {
            const input = document.getElementById('api-key-input').value.trim();
            if (input) {
                API_KEY = input;
                localStorage.setItem('openrouter_key', API_KEY);
                closeSettings();
                addMessage("✅ API Key Saved Successfully!", 'system');
                fetchModels(); // Auto-fetch models after saving key
            } else {
                alert("Please enter a valid API Key.");
            }
        }

        // --- TAB SWITCHING ---
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.getElementById('input-area').classList.remove('active');

            if (tab === 'models') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('models-tab').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('chat-tab').classList.add('active');
                document.getElementById('input-area').classList.add('active');
                document.getElementById('user-input').focus();
            }
        }

        // --- FETCH MODELS ---
        async function fetchModels() {
            if (!API_KEY) {
                document.getElementById('models-list').innerHTML = `<p style="text-align:center; color:red;">Please add API Key first!</p>`;
                return;
            }

            const listEl = document.getElementById('models-list');
            listEl.innerHTML = '<div class="spinner"></div>';

            try {
                const res = await fetch("https://openrouter.ai/api/v1/models", {
                    headers: { "Authorization": "Bearer " + API_KEY }
                });
                const data = await res.json();
                
                // Filter free models
                let models = data.data.filter(m => m.id.includes(':free') || (m.pricing && parseFloat(m.pricing.prompt) === 0));
                if (models.length === 0) models = data.data.slice(0, 30); 

                listEl.innerHTML = '';
                models.forEach(m => {
                    const card = document.createElement('div');
                    card.className = 'model-card';
                    card.innerHTML = `
                        <div class="model-id">${m.id}</div>
                        <div class="model-info">Context: ${m.context_length || 'Unknown'} tokens</div>
                    `;
                    card.onclick = () => {
                        selectedModel = m.id;
                        addMessage(`✅ Switched to: <b style="color:var(--accent)">${m.id}</b>`, 'system');
                        switchTab('chat');
                    };
                    listEl.appendChild(card);
                });
            } catch (err) {
                listEl.innerHTML = `<p style="color:red; text-align:center;">Error fetching models. Check API Key.</p>`;
            }
        }

        // --- CHAT FUNCTIONALITY ---
        function addMessage(text, type) {
            const msgEl = document.createElement('div');
            msgEl.className = `msg ${type}`;
            msgEl.innerHTML = text;
            document.getElementById('chat-messages').appendChild(msgEl);
            msgEl.scrollIntoView({ behavior: 'smooth' });
            return msgEl;
        }

        async function sendMessage() {
            if (!API_KEY) {
                alert("Please add your API Key in settings first!");
                openSettings();
                return;
            }

            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            addMessage(text, 'user');
            chatHistory.push({ role: "user", content: text });

            const sendBtn = document.getElementById('send-btn');
            sendBtn.disabled = true;
            const loader = addMessage('<div class="spinner" style="width:16px;height:16px;border-width:2px;"></div>', 'ai');

            try {
                const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + API_KEY,
                        "Content-Type": "application/json",
                        "HTTP-Referer": "http://localhost",
                        "X-Title": "Ayush Mobile Tester"
                    },
                    body: JSON.stringify({
                        model: selectedModel,
                        messages: chatHistory
                    })
                });

                const data = await res.json();
                loader.remove();

                if (data.error) {
                    addMessage(`❌ Error: ${data.error.message}`, 'system');
                } else {
                    const aiText = data.choices[0].message.content;
                    addMessage(aiText, 'ai');
                    chatHistory.push({ role: "assistant", content: aiText });
                }
            } catch (err) {
                loader.remove();
                addMessage("❌ Network error. Check connection.", 'system');
            }

            sendBtn.disabled = false;
        }

        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // --- INITIALIZATION ---
        window.onload = () => {
            if (!API_KEY) {
                // If no key is saved, open settings automatically on first launch
                openSettings();
            } else {
                fetchModels();
            }
        };
    </script>
</body>
</html>
